[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kata-pipeline"
version = "0.1.0"
description = "Pipeline d'extraction de clips vidéo de kata depuis des lives YouTube de compétitions de karaté"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "avincent" }]

dependencies = [
    "pandas>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "typer[all]>=0.9",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
download = ["yt-dlp>=2026.8.19"]
ui = ["streamlit>=1.41"]
# Phase 2 : extraction de poses + Graph Neural Network
gnn = [
    "mediapipe>=0.10",
    "torch>=2.1",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "tqdm>=4.66",
]
drive = [
    "google-api-python-client>=2.0",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]
all = ["kata-pipeline[download,ui,gnn,drive,dev]"]

[project.scripts]
kata-pipeline = "kata_pipeline.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kata_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
